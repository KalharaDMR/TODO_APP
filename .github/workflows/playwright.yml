name: Playwright Tests

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  test:
    timeout-minutes: 60 
    runs-on: ubuntu-latest
    
    # 🌟 DOCKER FIX 5: Run the entire job inside the Official Playwright Docker Container!
    # IMPORTANT: Change 'v1.42.1' to match the exactly Playwright version in your package.json
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 🌟 DOCKER FIX 6: Removed "npx playwright install --with-deps"
      # You no longer need this step because the Docker image above comes 
      # with all browsers and system dependencies pre-installed!

      - name: Run tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30